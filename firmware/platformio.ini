; Second String firmware. Build: pio run -e esp32dev. Host tests: pio test -e native.
; Flashing (pio run -e esp32dev -t upload) switches relays on real panels: a person confirms it.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3        ; ships arduino-esp32 2.0.17; pinned so every laptop builds the same thing
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    bblanchon/ArduinoJson@^7.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
test_ignore = test_native

[env:native]
platform = native
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
test_filter = test_native
