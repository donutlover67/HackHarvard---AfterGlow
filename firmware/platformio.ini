; Second String firmware. Build: pio run -e esp32dev (ESP32 DevKit) or pio run -e uno (Arduino Uno R3).
; Host tests: pio test -e native.
; Flashing (pio run -e esp32dev -t upload) switches relays on real panels: a person confirms it.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3        ; ships arduino-esp32 2.0.17; pinned so every laptop builds the same thing
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    bblanchon/ArduinoJson@^7.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<uno/>
test_ignore = test_native

; Arduino Uno R3: src/uno/main_uno.cpp with include/config_uno.h. Same protocol; see the header of main_uno.cpp
; for what differs. The pin map in config_uno.h is a proposal until docs/hardware.md confirms it.
[env:uno]
platform = atmelavr@5.3.0          ; framework-arduino-avr 5.4; pinned like the ESP32 platform
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
build_src_filter = +<uno/>
test_ignore = test_native

[env:native]
platform = native
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE
test_filter = test_native
